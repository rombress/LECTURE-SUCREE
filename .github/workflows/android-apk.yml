# ⏸ REPORTÉ À LA V2 (décision D16 : V1 = iPhone uniquement).
# Conservé sans modification fonctionnelle, mais plus déclenché
# automatiquement : lancement manuel uniquement, et non maintenu en V1.
#
# Lecture sucrée — compilation de l'APK Android (runner Linux standard,
# gratuit en dépôt public).
#
# Signature :
#  - si les secrets LS_ANDROID_* sont définis -> APK signé avec VOTRE clé
#    release (stable : les mises à jour s'installent par-dessus sans perte de
#    données) ;
#  - sinon -> APK signé avec une clé DEBUG générée par le runner. Installable,
#    mais réservé à la VÉRIFICATION : la clé change à chaque run, donc une mise
#    à jour exigerait de désinstaller l'app (et d'effacer ses données).
#
# Le keystore n'est jamais écrit dans le dépôt : il est décodé dans
# $RUNNER_TEMP (supprimé en fin de job). Voir docs/BUILD.md.
name: android-apk

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Java 17 (requis par React Native 0.88 / Gradle 9)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Contrôle de confidentialité
        run: node scripts/privacy-check.mjs --tracked

      - name: Install dependencies
        run: npm ci

      - name: Typecheck + tests
        run: npm run typecheck && npm test

      - name: Generate native Android project (expo prebuild)
        run: npx expo prebuild --platform android --clean --no-install

      - name: Prepare release keystore (si secrets présents)
        id: keystore
        env:
          KEYSTORE_B64: ${{ secrets.LS_ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
            echo "path=$RUNNER_TEMP/release.keystore" >> "$GITHUB_OUTPUT"
            echo "kind=release" >> "$GITHUB_OUTPUT"
            echo "Clé release fournie par les secrets."
          else
            echo "path=" >> "$GITHUB_OUTPUT"
            echo "kind=debug-VERIFICATION" >> "$GITHUB_OUTPUT"
            echo "::warning::Aucune clé release : APK signé avec une clé DEBUG (vérification uniquement, ne pas y stocker de vraies données)."
          fi

      - name: Build APK (release)
        working-directory: android
        env:
          LS_ANDROID_KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          LS_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.LS_ANDROID_KEYSTORE_PASSWORD }}
          LS_ANDROID_KEY_ALIAS: ${{ secrets.LS_ANDROID_KEY_ALIAS }}
          LS_ANDROID_KEY_PASSWORD: ${{ secrets.LS_ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Inspect APK (identité, permissions, signature)
        id: inspect
        run: |
          APK=$(find android/app/build/outputs/apk/release -name '*.apk' -print -quit)
          if [ -z "$APK" ]; then echo "::error::Aucun APK produit"; exit 1; fi
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          echo "--- Identité"
          "$BT/aapt2" dump badging "$APK" | grep -E "^package:|^application-label|sdkVersion|targetSdkVersion"
          echo "--- Permissions"
          "$BT/aapt2" dump permissions "$APK"
          echo "--- Signature (empreintes publiques du certificat)"
          "$BT/apksigner" verify --print-certs "$APK" | grep -E "Signer #1 certificate (DN|SHA-256)"
          VERSION=$(node -p "require('./node_modules/expo/config').getConfig('.', {skipSDKVersionRequirement:true}).exp.version")
          OUT="build/lecture-sucree-${VERSION}-${{ steps.keystore.outputs.kind }}.apk"
          mkdir -p build && cp "$APK" "$OUT"
          sha256sum "$OUT" | tee "$OUT.sha256"
          echo "apk=$OUT" >> "$GITHUB_OUTPUT"

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: lecture-sucree-apk-${{ steps.keystore.outputs.kind }}
          path: |
            ${{ steps.inspect.outputs.apk }}
            ${{ steps.inspect.outputs.apk }}.sha256
          if-no-files-found: error
          retention-days: 14
